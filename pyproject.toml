[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keim-genesis-prototype"
version = "7.8.5"
description = "Keim: field-based experimental programming language prototype"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "PyForge Genesis" }]
license = { text = "Prototype / see LICENSE.txt" }
keywords = ["dsl", "agent-simulation", "compiler", "runtime", "experimental-language"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]

[project.scripts]
keim = "keim.cli:main"

[tool.setuptools.packages.find]
include = ["keim", "keim.*"]

[tool.setuptools]
py-modules = []
